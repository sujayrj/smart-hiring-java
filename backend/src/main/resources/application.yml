server:
  port: 8080

spring:
  application:
    name: smarthire
  datasource:
    url: jdbc:h2:mem:smarthire;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:${LLM_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.0

llm:
  max-retries: 1

app:
  batch:
    enabled: ${APP_BATCH_ENABLED:false}     # scheduled resume auto-scoring across all JDs
    interval-ms: ${APP_BATCH_INTERVAL_MS:300000}
  jwt:
    secret: ${JWT_SECRET:smarthire-demo-secret-key-change-me-0123456789abcdef}
    expiration-minutes: 480

logging:
  level:
    com.smarthire: DEBUG
